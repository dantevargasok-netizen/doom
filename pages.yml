# SIN PROBAR. Compila Chocolate Doom -> WebAssembly (cloudflare/doom-wasm) y lo publica en GitHub Pages.
name: Build and deploy Doom
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y automake libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev
      - name: Clonar doom-wasm
        run: git clone --depth 1 https://github.com/cloudflare/doom-wasm.git
      - name: Compilar
        working-directory: doom-wasm
        run: ./scripts/clean.sh && ./scripts/build.sh
      - name: Descargar WAD shareware (doom1.wad)
        run: curl -fL https://distro.ibiblio.org/slitaz/sources/packages/d/doom1.wad -o doom-wasm/src/doom1.wad
      - uses: actions/upload-pages-artifact@v3
        with: { path: doom-wasm/src }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
